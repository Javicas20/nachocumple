<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4ede3">
<title>Para ti</title>
<link rel="preload" as="image" href="foto1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --marfil:#f4ede3; --marfil-2:#ebe1d3; --papel:#fbf8f2;
    --burdeos:#7a1f2b; --burdeos-osc:#561520; --oro:#b08d57; --oro-claro:#d6bc8c;
    --tinta:#3a2a26; --gris:#8a7c72;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Jost',sans-serif;font-weight:300;color:var(--tinta);
    background:
      radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.7),transparent 60%),
      radial-gradient(ellipse at 50% 110%,rgba(176,141,87,.18),transparent 60%),
      var(--marfil);
    user-select:none;-webkit-user-select:none;
  }
  /* marco fino dorado */
  body::before{
    content:"";position:fixed;inset:12px;border:1px solid rgba(176,141,87,.45);pointer-events:none;z-index:30;
  }
  .pantalla{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:28px;transition:opacity 1s ease,transform 1s ease;
  }
  .oculta{opacity:0;pointer-events:none;transform:scale(1.03)}
  .etiqueta{
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--oro);
  }

  /* ---------- MÚSICA ---------- */
  #sonido{
    position:fixed;top:22px;right:22px;z-index:45;width:38px;height:38px;border-radius:50%;
    border:1px solid rgba(176,141,87,.6);background:rgba(251,248,242,.85);color:var(--oro);
    display:none;align-items:center;justify-content:center;cursor:pointer;
  }
  #sonido.listo{display:flex}
  #sonido svg{width:18px;height:18px}
  #sonido .off{display:none}
  #sonido.mute .on{display:none}
  #sonido.mute .off{display:block}

  /* ---------- CARGA: GATITOS ---------- */
  #carga{
    position:fixed;inset:0;z-index:29;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:inherit;background-color:var(--marfil);transition:opacity .9s ease;
  }
  #carga.fuera{opacity:0;pointer-events:none}
  #gatos{width:min(78vw,320px);overflow:visible}
  .acerca-izq{animation:acercaIzq 2.6s ease-in-out infinite}
  .acerca-der{animation:acercaDer 2.6s ease-in-out infinite}
  @keyframes acercaIzq{0%,15%,85%,100%{transform:translateX(0)}40%,62%{transform:translateX(9px)}}
  @keyframes acercaDer{0%,15%,85%,100%{transform:translateX(0)}40%,62%{transform:translateX(-9px)}}
  .cola-izq,.cola-der{animation:cola 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 100%}
  .cola-der{animation-delay:-.6s}
  @keyframes cola{from{transform:rotate(-6deg)}to{transform:rotate(10deg)}}
  .besito{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:besito 2.6s ease-out infinite}
  @keyframes besito{0%,42%{opacity:0;transform:translateY(6px) scale(.4)}50%{opacity:1;transform:translateY(0) scale(1)}80%{opacity:0;transform:translateY(-22px) scale(1.1)}100%{opacity:0}}
  .texto-carga{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--burdeos)}
  .barra{width:120px;height:2px;background:rgba(176,141,87,.25);overflow:hidden;border-radius:2px}
  .barra i{display:block;height:100%;width:0;background:var(--oro);transition:width .4s ease}

  /* ---------- PANTALLA 1 ---------- */
  #mensaje{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
    font-size:clamp(26px,7.4vw,36px);color:var(--burdeos);line-height:1.2;
    text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center;
    margin:14px 0 30px;padding:0 16px;
  }
  #mensaje.pop{animation:aparece .6s ease}
  @keyframes aparece{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

  #corazon{
    width:80px;cursor:pointer;filter:drop-shadow(0 18px 28px rgba(86,21,32,.35));
    animation:latido 1.4s ease-in-out infinite;transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  #corazon.golpe{animation:golpe .35s ease}
  @keyframes latido{0%,100%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(.99)}42%{transform:scale(1.04)}}
  @keyframes golpe{0%{transform:scale(1)}40%{transform:scale(.86)}100%{transform:scale(1)}}
  #corazon.explota{animation:explota 1s ease forwards}
  @keyframes explota{0%{transform:scale(1)}30%{transform:scale(.85)}100%{transform:scale(7);opacity:0}}

  #zonaCorazon{display:flex;align-items:center;justify-content:center}
  #puntos{display:flex;gap:12px;margin-top:30px}
  #puntos span{width:7px;height:7px;border-radius:50%;border:1px solid var(--oro);transition:.35s}
  #puntos span.on{background:var(--oro);transform:scale(1.2)}
  .pista{margin-top:20px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris)}

  .mini{
    position:fixed;pointer-events:none;z-index:25;line-height:1;
    animation:sube 1.6s ease-out forwards;
  }
  @keyframes sube{
    0%{transform:translate(0,0) scale(.3);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot));opacity:0}
  }

  /* ---------- PANTALLA 2 ---------- */
  #p2{justify-content:center;gap:clamp(18px,3.5vh,34px);padding:34px 22px 30px}
  .titulo2{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;text-align:center;
    font-size:clamp(22px,6.2vw,30px);line-height:1.2;color:var(--burdeos);max-width:320px;
    opacity:0;transform:translateY(-10px);
  }
  .titulo2 .etiqueta{display:block;font-style:normal;margin-bottom:8px}
  #p2.visible .titulo2{animation:entra 1s ease forwards}

  .galeria{width:min(76vw,320px,calc(44vh * .75));opacity:0;transform:translateY(-20px)}
  #p2.visible .galeria{animation:entra 1s .3s ease forwards}
  @keyframes entra{to{opacity:1;transform:none}}
  .marco{
    background:var(--papel);padding:10px;box-shadow:0 18px 40px rgba(58,42,38,.18),0 0 0 1px rgba(176,141,87,.25);
  }
  .carrusel{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
    aspect-ratio:3/4;background:var(--marfil-2);
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  }
  .carrusel::-webkit-scrollbar{display:none}
  .carrusel img{
    flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;
    display:block;pointer-events:none;
  }
  .dots{display:flex;justify-content:center;gap:9px;margin-top:14px}
  .dots span{width:6px;height:6px;border-radius:50%;background:rgba(176,141,87,.3);transition:.3s}
  .dots span.on{background:var(--oro);width:18px;border-radius:3px}
  .desliza{text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-top:8px;transition:opacity .4s}

  /* Sobre */
  .zona-sobre{display:flex;flex-direction:column;align-items:center;gap:14px}
  .sobre{
    position:relative;width:min(66vw,250px,calc(20vh * 1.5));aspect-ratio:3/2;cursor:pointer;perspective:900px;
    opacity:0;transform:translateY(30px);
  }
  #p2.visible .sobre{animation:entra 1s .6s ease forwards}
  .sobre.tiembla{animation:tiembla 3s ease-in-out infinite !important;opacity:1;transform:none}
  @keyframes tiembla{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}94%{transform:rotate(-2deg)}97%{transform:rotate(1deg)}}

  .sobre .fondo{position:absolute;inset:0;background:#d9cbb6;box-shadow:0 14px 30px rgba(58,42,38,.22)}
  .sobre .carta{
    position:absolute;left:7%;right:7%;top:8%;height:84%;background:var(--papel);z-index:2;
    box-shadow:0 1px 4px rgba(0,0,0,.1);transition:transform 1s cubic-bezier(.5,0,.3,1) .45s;
    display:flex;align-items:flex-start;justify-content:center;padding-top:12%;
    font-family:'Pinyon Script',cursive;font-size:24px;color:var(--burdeos);
  }
  .sobre .frente{
    position:absolute;inset:0;z-index:3;background:#ebe0cf;
    clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);
  }
  .sobre .frente::before,.sobre .frente::after{content:"";position:absolute;inset:0}
  .sobre .frente::before{background:#e3d6c2;clip-path:polygon(0 0,50% 56%,0 100%)}
  .sobre .frente::after{background:#f1e8da;clip-path:polygon(0 100%,50% 48%,100% 100%)}
  .sobre .solapa{
    position:absolute;left:0;right:0;top:0;height:58%;z-index:4;transform-origin:top;
    background:#e6dac7;clip-path:polygon(0 0,100% 0,50% 100%);
    transition:transform .7s ease, z-index 0s .35s;
  }
  .sobre .lacre{
    position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);z-index:5;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#a8313f,var(--burdeos) 55%,var(--burdeos-osc));
    box-shadow:0 3px 6px rgba(0,0,0,.3), inset 0 0 0 4px rgba(0,0,0,.08);
    display:flex;align-items:center;justify-content:center;transition:opacity .3s, transform .3s;
  }
  .sobre .lacre svg{width:20px;opacity:.75}
  .sobre .destino{
    position:absolute;left:0;right:0;bottom:5%;z-index:5;text-align:center;
    font-family:'Pinyon Script',cursive;font-size:clamp(18px,5.4vw,24px);color:var(--burdeos);transition:opacity .3s;
  }
  .sobre.abierto .destino{opacity:0}
  .sobre.abierto .solapa{transform:rotateX(180deg);z-index:1}
  .sobre.abierto .lacre{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  .sobre.abierto .carta{transform:translateY(-62%)}
  .sobre.abierto{animation:none !important;opacity:1;transform:none}
  .toca{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);transition:opacity .3s;text-align:center}

  /* Carta abierta */
  #lectura{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(58,42,38,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .6s;
  }
  #lectura.visible{opacity:1;pointer-events:auto}
  .hoja{
    background:var(--papel);width:min(90vw,440px);max-height:84vh;overflow-y:auto;
    padding:44px 30px 34px;box-shadow:0 24px 60px rgba(0,0,0,.3);position:relative;
    outline:1px solid rgba(176,141,87,.5);outline-offset:-10px;
    transform:scale(.7) translateY(80px);transition:transform .7s cubic-bezier(.34,1.3,.64,1);
    user-select:text;-webkit-user-select:text;text-align:center;
  }
  #lectura.visible .hoja{transform:none}
  .hoja .orn{color:var(--oro);font-size:14px;letter-spacing:.5em;margin-bottom:14px}
  .hoja h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:40px;color:var(--burdeos);margin-bottom:22px;line-height:1.15}
  .hoja p{font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.55;white-space:pre-line;text-align:left}
  .hoja .firma{font-family:'Pinyon Script',cursive;font-size:30px;text-align:right;margin-top:24px;color:var(--burdeos)}
  .cerrar{
    position:absolute;top:16px;right:20px;border:none;background:none;font-size:24px;font-weight:300;color:var(--oro);cursor:pointer;
  }
</style>
</head>
<body>

<!-- Música -->
<audio id="musica" loop preload="auto"></audio>
<button id="sonido" aria-label="Silenciar música">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<!-- ========== CARGA ========== -->
<div id="carga">
  <svg id="gatos" viewBox="0 0 200 120" aria-label="Dos gatitos dándose un beso"></svg>
  <div class="texto-carga">Preparando algo bonito…</div>
  <div class="barra"><i id="progreso"></i></div>
</div>

<!-- ========== PANTALLA 1 ========== -->
<section id="p1" class="pantalla">
  <div class="etiqueta">Para ti</div>
  <div id="mensaje">Tócame</div>
  <div id="zonaCorazon">
  <svg id="corazon" viewBox="0 0 100 90" aria-label="Corazón">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2=".8" y2="1">
        <stop offset="0" stop-color="#a3303e"/><stop offset=".55" stop-color="#7a1f2b"/><stop offset="1" stop-color="#4a111b"/>
      </linearGradient>
      <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e3cc9f"/><stop offset="1" stop-color="#9c7743"/>
      </linearGradient>
    </defs>
    <path d="M50 88 C20 66 2 50 2 28 C2 13 14 2 28 2 C38 2 46 8 50 16 C54 8 62 2 72 2 C86 2 98 13 98 28 C98 50 80 66 50 88Z" fill="url(#g)" stroke="url(#borde)" stroke-width="1.2"/>
    <path d="M14 26 C14 17 21 11 29 11" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>
  </svg>
  </div>
  <div id="puntos"></div>
  <div class="pista">toca el corazón</div>
</section>

<!-- ========== PANTALLA 2 ========== -->
<section id="p2" class="pantalla oculta">
  <h1 class="titulo2"><span class="etiqueta">✦</span>Hoy es el cumpleaños de mi persona favorita</h1>
  <div class="galeria">
    <div class="marco"><div class="carrusel" id="carrusel"></div></div>
    <div class="dots" id="dots"></div>
    <div class="desliza" id="desliza">desliza ←→</div>
  </div>

  <div class="zona-sobre">
    <div class="sobre" id="sobre" role="button" aria-label="Abrir carta">
      <div class="fondo"></div>
      <div class="carta">Para mi amor</div>
      <div class="frente"></div>
      <div class="solapa"></div>
      <div class="destino">Para mi amor</div>
      <div class="lacre"><svg viewBox="0 0 100 90"><path d="M50 88 C20 66 2 50 2 28 C2 13 14 2 28 2 C38 2 46 8 50 16 C54 8 62 2 72 2 C86 2 98 13 98 28 C98 50 80 66 50 88Z" fill="#e8cfa0"/></svg></div>
    </div>
    <div class="toca" id="toca">toca el sobre</div>
  </div>
</section>

<!-- Carta abierta -->
<div id="lectura">
  <div class="hoja">
    <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
    <div class="orn">✦ ✦ ✦</div>
    <h2 id="tituloCarta"></h2>
    <p id="textoCarta"></p>
    <div class="firma" id="firmaCarta"></div>
  </div>
</div>

<script>
/* =========================================================
   ✏️  EDITA AQUÍ
   ========================================================= */
const CONFIG = {
  // Canción (mp3 en la misma carpeta). Empieza al primer toque del corazón.
  cancion: "cancion.mp3",
  volumen: 0.6,
  empiezaEnSegundo: 0,   // por si quieres que arranque en el estribillo

  // Fotos del carrusel (en la misma carpeta que este archivo)
  fotos: ["foto1.jpg", "foto2.jpg", "foto3.jpg"],

  tituloCarta: "Feliz cumpleaños, mi amor",
  textoCarta: `Aquí va la felicitación.

Puedes escribir varios párrafos y se respetan los saltos de línea.`,
  firma: "Te quiero",

  // Un mensaje por toque (el número de mensajes = toques necesarios)
  mensajes: [
    "Te quiero",
    "Sigue dándole para que te quiera más",
    "Un poco más…",
    "Te quiero muchísimo",
    "Casi…",
    "Te quiero infinito"
  ]
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const corazon = $("corazon"), mensaje = $("mensaje"), puntos = $("puntos");
let toques = 0, bloqueado = false;

/* --- Carrusel --- */
const carrusel = $("carrusel"), dots = $("dots");
const placeholder = n => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#ebe1d3"/><text x="200" y="262" font-family="Georgia,serif" font-style="italic" font-size="34" fill="#b08d57" text-anchor="middle">Foto ${n}</text></svg>`);
CONFIG.fotos.forEach((src, i) => {
  const img = document.createElement("img");
  img.src = src; img.alt = "Foto " + (i+1); img.draggable = false;
  img.onerror = function(){ this.onerror = null; this.src = placeholder(i+1); };
  carrusel.appendChild(img);
  dots.appendChild(document.createElement("span"));
});
dots.children[0].classList.add("on");
if (CONFIG.fotos.length < 2) { dots.style.display = "none"; $("desliza").style.display = "none"; }
carrusel.addEventListener("scroll", () => {
  const i = Math.round(carrusel.scrollLeft / carrusel.clientWidth);
  [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
  if (i > 0) $("desliza").style.opacity = 0;
}, { passive: true });

/* --- Textos --- */
$("tituloCarta").textContent = CONFIG.tituloCarta;
$("textoCarta").textContent = CONFIG.textoCarta;
$("firmaCarta").textContent = CONFIG.firma;
CONFIG.mensajes.forEach(() => puntos.appendChild(document.createElement("span")));

function vibrar(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

function lluvia(x, y, n){
  const colores = ["#7a1f2b", "#a3303e", "#b08d57", "#d6bc8c"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "mini";
    s.textContent = Math.random() < .7 ? "♥" : "✦";
    s.style.color = colores[Math.floor(Math.random()*colores.length)];
    const ang = Math.random()*Math.PI*2, dist = 70 + Math.random()*150;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(ang)*dist + "px");
    s.style.setProperty("--dy", (Math.sin(ang)*dist - 70) + "px");
    s.style.setProperty("--rot", (Math.random()*60-30) + "deg");
    s.style.fontSize = (12 + Math.random()*16) + "px";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1700);
  }
}

/* --- Música --- */
const musica = $("musica"), sonido = $("sonido");
let musicaOk = false, musicaSonando = false;
musica.addEventListener("canplay", () => { musicaOk = true; }, { once: true });
musica.addEventListener("error", () => { musicaOk = false; });
musica.src = CONFIG.cancion;
function arrancarMusica(){
  if (musicaSonando || !musica.src) return;
  musicaSonando = true;
  try { musica.currentTime = CONFIG.empiezaEnSegundo; } catch(e){}
  musica.volume = 0;
  musica.play().then(() => {
    sonido.classList.add("listo");
    let v = 0;                                   // entra suave
    const t = setInterval(() => {
      v = Math.min(CONFIG.volumen, v + 0.03);
      musica.volume = v;
      if (v >= CONFIG.volumen) clearInterval(t);
    }, 100);
  }).catch(() => { musicaSonando = false; });   // sin archivo o bloqueado: seguimos sin música
}
sonido.addEventListener("click", e => {
  e.stopPropagation();
  musica.muted = !musica.muted;
  sonido.classList.toggle("mute", musica.muted);
});

/* --- Corazón --- */
corazon.addEventListener("click", () => {
  if (bloqueado) return;
  arrancarMusica();
  const total = CONFIG.mensajes.length;
  mensaje.textContent = CONFIG.mensajes[toques];
  mensaje.classList.remove("pop"); void mensaje.offsetWidth; mensaje.classList.add("pop");
  puntos.children[toques].classList.add("on");
  toques++;

  ajustarCorazon();
  corazon.classList.remove("golpe"); void corazon.offsetWidth; corazon.classList.add("golpe");
  vibrar(25 + toques*10);
  const r = corazon.getBoundingClientRect();
  lluvia(r.left + r.width/2, r.top + r.height/2, 5 + toques*3);

  if (toques >= total){
    bloqueado = true;
    setTimeout(() => {
      corazon.classList.add("explota"); vibrar([60,40,120]);
      lluvia(innerWidth/2, innerHeight/2, 36);
    }, 1000);
    setTimeout(irAPantalla2, 1900);
  }
});

function tamMax(){
  // ancho máximo que cabe sin salirse (el corazón es 100x90)
  const porAlto = (innerHeight - 330) / 0.9;
  return Math.max(140, Math.min(innerWidth * 0.84, porAlto, 520));
}
function ajustarCorazon(){
  const max = tamMax(), min = max * 0.28;
  const w = min + (max - min) * (toques / CONFIG.mensajes.length);
  corazon.style.width = w + "px";
  $("zonaCorazon").style.height = (max * 0.9 * 1.08) + "px";
}
ajustarCorazon();
addEventListener("resize", ajustarCorazon);

  <path class="besito" d="M100 30 C93 24 88 20 88 15 C88 11 91 9 94 9 C97 9 99 11 100 13 C101 11 103 9 106 9 C109 9 112 11 112 15 C112 20 107 24 100 30Z" fill="#7a1f2b"/>`;

// ---------- Carga de fotos ----------
function cargarFoto(src){
  return new Promise(res => {
    const i = new Image();
    i.onload = () => (i.decode ? i.decode().catch(()=>{}) : Promise.resolve()).then(res);
    i.onerror = res;
    i.src = src;
  });
}
let hechas = 0;
const tareas = CONFIG.fotos.map(f => cargarFoto(f).then(() => {
  hechas++; $("progreso").style.width = (hechas / CONFIG.fotos.length * 100) + "%";
}));
const minimo = new Promise(r => setTimeout(r, 2600));          // que se vea la animación
const limite = new Promise(r => setTimeout(r, 15000));         // por si la conexión va fatal
const fuentes = document.fonts ? document.fonts.ready : Promise.resolve();
Promise.race([Promise.all([...tareas, fuentes, minimo]), limite]).then(() => {
  $("carga").classList.add("fuera");
  setTimeout(() => $("carga").remove(), 1000);
});

function irAPantalla2(){
  $("p1").classList.add("oculta");
  const p2 = $("p2");
  p2.classList.remove("oculta");
  p2.classList.add("visible");
  setTimeout(() => $("sobre").classList.add("tiembla"), 1800);
}

/* --- Sobre --- */
const sobre = $("sobre");
sobre.addEventListener("click", () => {
  if (sobre.classList.contains("abierto")) { $("lectura").classList.add("visible"); return; }
  sobre.classList.remove("tiembla");
  sobre.classList.add("abierto");
  $("toca").style.opacity = 0;
  vibrar(40);
  setTimeout(() => {
    $("lectura").classList.add("visible");
    lluvia(innerWidth/2, innerHeight*0.7, 20);
  }, 1600);
});
$("cerrar").addEventListener("click", e => {
  e.stopPropagation();
  $("lectura").classList.remove("visible");
  $("toca").textContent = "toca el sobre para volver a leer";
  $("toca").style.opacity = 1;
});
</script>
